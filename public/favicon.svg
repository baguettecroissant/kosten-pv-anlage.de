<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3949AB"/>
      <stop offset="100%" stop-color="#283593"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00BFA5"/>
      <stop offset="100%" stop-color="#00897B"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Chart Bars -->
  <!-- Bar 1 (Left) -->
  <rect x="6" y="16" width="5" height="10" rx="1.5" fill="url(#bar1)"/>
  <!-- Bar 2 (Middle) -->
  <rect x="13" y="10" width="5" height="16" rx="1.5" fill="url(#bar2)"/>
  <!-- Bar 3 (Right) -->
  <rect x="20" y="6" width="5" height="20" rx="1.5" fill="url(#bar1)"/>
  <!-- Trend line with dots -->
  <path d="M8.5 15 L15.5 9.5 L22.5 5.5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="8.5" cy="15" r="1.5" fill="white"/>
  <circle cx="15.5" cy="9.5" r="1.5" fill="white"/>
  <circle cx="22.5" cy="5.5" r="1.5" fill="white"/>
</svg>
